models:
  logistic_regression:
    max_iter: 1000
    class_weight: balanced
  random_forest:
    n_estimators: 300
    max_depth: 20
    class_weight: balanced
    n_jobs: -1
  xgboost:
    n_estimators: 400
    max_depth: 8
    learning_rate: 0.1
    scale_pos_weight: 8     # ~ licit/illicit ratio in train
    n_jobs: 1
    eval_metric: logloss
  lightgbm:
    n_estimators: 400
    max_depth: -1
    num_leaves: 64
    learning_rate: 0.1
    class_weight: balanced
    n_jobs: 1
    verbose: -1