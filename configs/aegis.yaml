experts:
  windows:            # [start, end] inclusive; overlapping on purpose
    - [1, 12]
    - [12, 23]
    - [23, 34]

gating:
  temperature: 0.05   # softmax temp over -PSI; smaller = sharper expert selection
  n_bins: 10

features:
  use_embeddings: true
  embeddings_file: data/processed/sage_embeddings.npy

expert_model:         # LightGBM params for every expert
  n_estimators: 400
  num_leaves: 64
  learning_rate: 0.1
  class_weight: balanced
  n_jobs: 1
  verbose: -1